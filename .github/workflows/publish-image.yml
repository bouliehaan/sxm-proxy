# Publishes the container image people actually install from.
#
# A release is not usable until the image below exists: installing is
# `docker compose pull`, and there is nothing else to install from.
name: Publish container image

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            ref:
                description: Tag to build an image for
                required: true
                default: v1.0.0

jobs:
    image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out the tag being released
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.ref || github.ref }}

            - name: Work out the version to tag the image with
              id: version
              run: echo "value=${{ github.event.inputs.ref || github.ref_name }}" >> "$GITHUB_OUTPUT"

            # The Dockerfile builds from sxm-player/, which this repo clones
            # rather than vendors (and gitignores), so it is absent from a fresh
            # checkout. Pinned to the commit the README documents.
            - name: Fetch the pinned upstream checkout the Dockerfile builds from
              uses: actions/checkout@v4
              with:
                  repository: yob15662/sxm-player
                  ref: 470b35b44de00514f1fd626b06c56367695c6efc
                  path: sxm-player

            - uses: docker/setup-buildx-action@v3

            - name: Log in to ghcr.io
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # amd64 only: a .NET SDK build under arm64 emulation is not worth the
            # wall clock, and the boxes this runs on are x86_64.
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64
                  tags: |
                      ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
                      ghcr.io/${{ github.repository }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # The compose file goes to the same registry as the image, as an OCI
            # artifact, so the documented install is one command with nothing to
            # fetch or edit:
            #
            #   docker compose -f oci://ghcr.io/bouliehaan/sxm-proxy:compose up -d
            #
            # --resolve-image-digests pins the reference inside the artifact to
            # the image built immediately above.
            - name: Publish the compose artifact
              env:
                  SXM_USERNAME: placeholder@example.com
              run: |
                  docker compose -f docker-compose.yml publish --yes \
                      --resolve-image-digests \
                      "ghcr.io/${{ github.repository }}:compose-${{ steps.version.outputs.value }}"
                  docker compose -f docker-compose.yml publish --yes \
                      --resolve-image-digests \
                      "ghcr.io/${{ github.repository }}:compose"

            # A published artifact nobody can resolve is worse than none: the
            # documented install would fail on its very first command.
            - name: Check the published artifact resolves
              env:
                  SXM_USERNAME: placeholder@example.com
              run: |
                  docker compose -f "oci://ghcr.io/${{ github.repository }}:compose" config >/dev/null
                  echo "oci://ghcr.io/${{ github.repository }}:compose resolves"
